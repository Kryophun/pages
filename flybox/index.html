<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>FlyBox ARTCC Feed Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="filter-bar">
        <span id="filter-title">ARTCC Feeds</span>
        <label class="filter-master">
            <input type="checkbox" id="f-artcc" checked> ARTCC
        </label>
        <span class="filter-sub-group">
            <label><input type="checkbox" id="f-low"> Low</label>
            <label><input type="checkbox" id="f-highultra" checked> High+Ultra High</label>
            <label><input type="checkbox" id="f-oceanic" checked> Oceanic</label>
        </span>
        <span id="feed-count"></span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Static feed data snapshot + app logic -->
    <script src="feeds.js"></script>
    <script src="app.js"></script>
</body>
</html>
